<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Demolition Pong</title>
    <link data-trunk rel="rust" data-wasm-opt="s" data-bin="demolition-pong" />
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #121217;
        overflow: hidden;
      }
      canvas#bevy {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #aab;
        font: 16px system-ui, sans-serif;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="loading">Loading Demolition Pong…</div>
    <canvas id="bevy" tabindex="0"></canvas>
    <script>
      // Hide the loading note once Bevy starts drawing, and give the canvas keyboard focus.
      const canvas = document.getElementById("bevy");
      new ResizeObserver(() => document.getElementById("loading")?.remove()).observe(canvas);
      canvas.addEventListener("pointerdown", () => canvas.focus());
    </script>
  </body>
</html>
